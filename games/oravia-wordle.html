<!--
  Oravia Daily Word — wordle-style game
  ─────────────────────────────────────
  HOW IT WORKS
  • Deterministic per UTC calendar date: everyone gets the same word each day,
    no server needed. Rollover happens at midnight UTC.
  • Word LENGTH also changes daily (4–7 letters); the board is built dynamically.
  • Beginner clue: the English gloss is shown before guessing.
  • After finishing, a reveal card shows the word, its meaning, the
    cluster/subcluster/root breakdown, and a dictionary link.
  • localStorage keeps today's guesses (resume on reload) and lifetime stats.

  DICTIONARY SOURCE
  • The page tries to fetch dictionary_data.json (also data/… and ../data/…),
    the same file used by the site. If none is reachable, it falls back to the
    embedded copy and shows an "embedded vocabulary" badge.
  • IMPORTANT: the daily word is picked from an alphabetically sorted pool, so
    fetched and embedded data agree as long as the word list is the same.
    Editing the dictionary (adding/removing words) will shift future answers.

  EMBEDDING IN MKDOCS MATERIAL
  Save into docs/ (e.g. docs/games/wordle.html) and link, or iframe it:
      <iframe src="../wordle.html" style="width:100%;height:1000px;border:0"></iframe>
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oravia Daily Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF6;
    --ink:#23324D;
    --ink-soft:#5A6478;
    --line:#C9CDD6;
    --teal:#2E7D74;
    --teal-soft:#E3F0EE;
    --gold:#C9A227;
    --gold-soft:#F6ECC9;
    --good:#DDF0DE;
    --good-ink:#2F6B3A;
    --bad:#F7DCDC;
    --bad-ink:#8C3B3B;
    --absent:#E5E4DF;
    --absent-ink:#8B8A84;
    --radius:10px;
    --tile:58px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Atkinson Hyperlegible",system-ui,sans-serif;
    line-height:1.45;
    padding:28px 16px 64px;
  }
  .wrap{max-width:560px;margin:0 auto}

  header{margin-bottom:14px}
  .eyebrow{
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--teal);font-weight:700;margin:0 0 2px;
  }
  h1{font-size:30px;margin:0;font-weight:700}
  .meta{color:var(--ink-soft);font-size:15px;margin-top:4px}
  .badge{
    display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;
    background:var(--bad);color:var(--bad-ink);font-size:12px;font-weight:700;
    vertical-align:2px;
  }

  /* ── clue ─────────────────────────────── */
  .clue-card{
    background:var(--teal-soft);border-radius:var(--radius);
    padding:10px 16px;margin:0 0 18px;font-size:17px;
  }
  .clue-card .lbl{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--teal);font-weight:700;display:block;
  }
  .clue-card .len{color:var(--ink-soft);font-size:14px}
  .clue-card .tip{border-top:1px solid rgba(46,125,116,.25);margin-top:8px;padding-top:6px}
  .clue-card .tip-sound{
    font-weight:700;text-transform:lowercase;background:#fff;
    border:2px solid var(--teal);border-radius:6px;padding:0 8px;margin-right:4px;
  }

  /* ── board ────────────────────────────── */
  #board{display:grid;gap:6px;justify-content:center;margin-bottom:20px}
  .row{display:grid;gap:6px}
  .tile{
    width:var(--tile);height:var(--tile);
    border:2px solid var(--line);border-radius:8px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;text-transform:lowercase;
    transition:transform .08s ease;
  }
  .tile.filled{border-color:var(--ink-soft);transform:scale(1.04)}
  .tile.hit    {background:var(--good);  border-color:var(--good-ink);  color:var(--good-ink)}
  .tile.near   {background:var(--gold-soft);border-color:var(--gold);   color:#7A6215}
  .tile.miss   {background:var(--absent);border-color:var(--absent);    color:var(--absent-ink)}
  @media (prefers-reduced-motion:no-preference){
    .tile.reveal{animation:flip .45s ease}
    @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
    .row.shake{animation:shake .35s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  }

  /* ── keyboard ─────────────────────────── */
  #kb{display:flex;flex-direction:column;gap:6px;align-items:center}
  .kb-row{display:flex;gap:5px;justify-content:center;width:100%}
  .key{
    flex:1;max-width:46px;min-width:0;height:52px;
    border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
    font-family:inherit;font-weight:700;font-size:16px;text-transform:lowercase;
    cursor:pointer;padding:0;
  }
  .key.wide{max-width:76px;font-size:13px;text-transform:none}
  .key:hover{border-color:var(--teal)}
  .key:focus-visible{outline:3px solid var(--gold-soft);outline-offset:1px}
  .key.hit  {background:var(--good);  border-color:var(--good-ink); color:var(--good-ink)}
  .key.near {background:var(--gold-soft);border-color:var(--gold);  color:#7A6215}
  .key.miss {background:var(--absent);border-color:var(--absent);   color:var(--absent-ink)}
  .kb-row.vowels .key{background:var(--paper)}

  #msg{
    text-align:center;min-height:24px;margin:12px 0 0;
    font-weight:700;color:var(--bad-ink);
  }

  /* ── reveal card ──────────────────────── */
  #reveal{
    display:none;margin-top:22px;border:2px solid var(--teal);
    border-radius:var(--radius);background:#fff;overflow:hidden;
  }
  #reveal.show{display:block}
  #reveal .head{
    background:var(--teal-soft);padding:12px 18px;
  }
  #reveal .head .word{font-size:28px;font-weight:700}
  #reveal .head .gloss{color:var(--ink-soft)}
  #reveal .body{padding:14px 18px 18px}
  #reveal h3{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin:12px 0 6px;font-weight:700;
  }
  #reveal h3:first-child{margin-top:0}
  .bb{
    display:inline-flex;flex-direction:column;align-items:center;
    border:2px solid var(--line);border-radius:8px;padding:6px 12px;margin:0 6px 6px 0;
    background:var(--paper);
  }
  .bb .sound{font-weight:700;font-size:18px}
  .bb .kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
  .bb .mean{font-size:13px;color:var(--ink-soft)}
  .bb.plus{border:none;background:none;padding:6px 2px;font-size:20px;color:var(--ink-soft);align-self:center}
  #reveal a{color:var(--teal);font-weight:700}

  /* ── stats ────────────────────────────── */
  #stats{margin-top:14px;display:none}
  #stats.show{display:block}
  #stats .nums{display:flex;gap:18px;margin-bottom:10px}
  #stats .nums div{text-align:center}
  #stats .nums .v{font-size:24px;font-weight:700}
  #stats .nums .l{font-size:12px;color:var(--ink-soft)}
  .dist-row{display:flex;align-items:center;gap:8px;font-size:14px;margin:2px 0}
  .dist-row .bar{
    background:var(--teal);color:#fff;border-radius:4px;
    padding:1px 8px;min-width:24px;text-align:right;font-weight:700;
  }

  #btn-again{
    display:block;width:100%;margin-top:14px;
    font-family:inherit;font-size:15px;font-weight:700;
    padding:10px 18px;border-radius:999px;cursor:pointer;
    border:2px solid var(--ink);background:var(--ink);color:#fff;
  }
  #btn-again:hover{background:var(--teal);border-color:var(--teal)}
  #btn-again:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}

  footer{margin-top:28px;color:var(--ink-soft);font-size:13px;text-align:center}

  @media (max-width:480px){
    :root{--tile:calc((100vw - 32px - 6*6px)/7)}
    body{padding:18px 10px 48px}
    h1{font-size:24px}
    .key{height:48px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Oravia daily</p>
    <h1>Daily Word</h1>
    <p class="meta"><span id="meta-date"></span> · Puzzle #<span id="meta-num"></span><span id="vocab-badge" class="badge" hidden>embedded vocabulary</span></p>
  </header>

  <div class="clue-card">
    <span class="lbl">Today's meaning</span>
    <span id="clue-gloss"></span>
    <span class="len" id="clue-len"></span>
    <div class="tip"><span class="lbl">Cluster tip</span>
      <span class="tip-sound" id="tip-sound"></span> <span id="tip-mean"></span>
    </div>
  </div>

  <div id="board" aria-label="Guess grid"></div>
  <p id="msg" role="status" aria-live="polite"></p>
  <div id="kb" aria-label="Keyboard"></div>

  <div id="reveal">
    <div class="head">
      <div class="word" id="rv-word"></div>
      <div class="gloss" id="rv-gloss"></div>
    </div>
    <div class="body">
      <div id="rv-bd-wrap">
        <h3>Building blocks</h3>
        <div id="rv-bd"></div>
      </div>
      <h3>Dictionary</h3>
      <a id="rv-link" target="_blank" rel="noopener">Open in the Oravia dictionary →</a>
      <button id="btn-again">Play another word</button>
      <div id="stats">
        <h3>Your statistics</h3>
        <div class="nums">
          <div><div class="v" id="st-played">0</div><div class="l">played</div></div>
          <div><div class="v" id="st-winpct">0</div><div class="l">win %</div></div>
          <div><div class="v" id="st-streak">0</div><div class="l">streak</div></div>
          <div><div class="v" id="st-max">0</div><div class="l">best streak</div></div>
        </div>
        <div id="st-dist"></div>
      </div>
    </div>
  </div>

  <footer>
    A new word appears every day at midnight UTC. Guesses can be any letter combination.
  </footer>
</div>

  {"w": "yunmpou", "e": "lazy", "ea": "lazy, indolence, inactivity", "bd": [["yun", "personal characteristics", "subcluster"], ["mpou", "lazy", ""]]},
  {"w": "yunrani", "e": "beautiful", "ea": "beautiful, beauty, beautify, pretty", "bd": [["yun", "personal characteristics", "subcluster"], ["rani", "beautiful", ""]]},
  {"w": "yunro", "e": "smart", "ea": "smart, intelligence", "bd": [["yun", "personal characteristics", "subcluster"], ["ro", "thinking, reasoning", "root"]]},
  {"w": "yuparde", "e": "ironic", "ea": "irony, ironic, sarcasm", "bd": [["yu", "subjective qualities", "subcluster"], ["parde", "ironic", ""]]},
  {"w": "yuniu", "e": "rare", "ea": "rare, unusual, weird, strange", "bd": [["yu", "subjective qualities", "subcluster"], ["niu", "some", "subcluster"]]},
  {"w": "yuvabo", "e": "comfortable", "ea": "comfortable, cozy", "bd": [["yu", "subjective qualities", "subcluster"], ["vabo", "cozy, body home", "root"]]},
  {"w": "anu", "e": "close", "ea": "close, shut", "bd": [["an", "action", "subcluster"], ["nu", "limit", "subcluster"]]},
  {"w": "anilie", "e": "maybe", "ea": "maybe, try, attempt", "bd": [["an", "action", "subcluster"], ["ilie", "maybe", ""]]},
  {"w": "vatale", "e": "neck", "ea": "neck, throat", "bd": [["va", "core", "subcluster"], ["tale", "through", "subcluster"]]},
  {"w": "oivamin", "e": "sex", "ea": "sex, sensual pleasure", "bd": [["oi", "fun", "subcluster"], ["va", "core", "subcluster"], ["min", "pleasure", "root"]]}
];

/* ════════════════════════════════════════════════════════════════
   CONFIG + DAILY SEED (UTC rollover)
   ════════════════════════════════════════════════════════════════ */
const CFG = {
  LENGTHS: [4, 5, 6, 7],          // daily word length rotates among these
  SALT: "v3",                     // bump to re-roll the whole daily sequence
  MAX_GUESSES: 6,
  EPOCH: "2026-07-11",            // puzzle #1 date (UTC) — change to launch day
  WORDS_URLS: ["dictionary_data.json", "data/dictionary_data.json", "../data/dictionary_data.json"],
  // NOTE: ?q= is intercepted by MkDocs Material's site search, which doesn't
  // index the JS-rendered dictionary entries. Plain link until the dictionary
  // page supports a deep-link (e.g. #word anchors or its own ?word= param).
  DICT_URL: w => "https://learnoravia.com/content/dictionary/",
  LS_STATE: "oravia_wordle_state",
  LS_STATS: "oravia_wordle_stats",
  LOG_URL: "https://script.google.com/macros/s/AKfycbyK1kWJRcXZ9tHqLGYZP8ZG90OcMj8ld3zUSNjvyOhHiSJyr5GIep0tdCxF9xMBamia/exec",
};
const ALPHABET = "abcdefghijlmnoprstuvwy";     // the 22 Oravia letters
const params = new URLSearchParams(location.search);

function todayISO(){                            // UTC date, not local
  return new Date().toISOString().slice(0, 10);
}
function puzzleNumber(iso){
  const ms = Date.parse(iso + "T00:00:00Z") - Date.parse(CFG.EPOCH + "T00:00:00Z");
  return Math.max(1, Math.round(ms / 86400000) + 1);
}
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ════════════════════════════════════════════════════════════════
   VOCABULARY
   ════════════════════════════════════════════════════════════════ */
function normalizeEntry(x){
  return {
    w:  String(x.w ?? x.word ?? "").toLowerCase().trim(),
    e:  String(x.e ?? x.gloss ?? ""),
    ea: String(x.ea ?? ""),
    bd: Array.isArray(x.bd)
        ? x.bd.map(b => Array.isArray(b) ? b : [b.sound ?? "", b.meaning ?? "", b.bb_type ?? ""])
        : [],
  };
}
async function loadWords(){
  const srcs = params.get("src") ? [params.get("src")] : CFG.WORDS_URLS;
  for (const src of srcs){
    try{
      const res = await fetch(src, {cache: "no-store"});
      if (!res.ok) throw 0;
      const data = await res.json();
      const list = (Array.isArray(data) ? data : data.words || [])
        .map(normalizeEntry).filter(x => x.w && x.e);
      if (list.length >= 50) return {list, embedded: false};
    }catch{ /* try next candidate */ }
  }
  return {list: DICT_WORDS.map(normalizeEntry), embedded: true};
}

/* ════════════════════════════════════════════════════════════════
   DAILY WORD — deterministic: length first, then word from a
   sorted pool, so fetched and embedded data agree.
   ════════════════════════════════════════════════════════════════ */
function pickDaily(list, iso){
  const byLen = new Map();
  for (const x of list){
    if (!/^[a-z]+$/.test(x.w)) continue;
    if (!x.bd || !x.bd.length) continue;   // tip needs a breakdown
    if (!byLen.has(x.w.length)) byLen.set(x.w.length, []);
    byLen.get(x.w.length).push(x);
  }
  const usable = CFG.LENGTHS.filter(L => (byLen.get(L) || []).length >= 10);
  const L = usable[hashStr("oravia-len-" + CFG.SALT + "-" + iso) % usable.length];
  const pool = byLen.get(L).slice().sort((a, b) => a.w < b.w ? -1 : 1);
  return pool[hashStr("oravia-word-" + CFG.SALT + "-" + iso) % pool.length];
}

/* ════════════════════════════════════════════════════════════════
   PERSISTENCE
   ════════════════════════════════════════════════════════════════ */
function loadState(iso){
  try{
    const s = JSON.parse(localStorage.getItem(CFG.LS_STATE + "_" + CFG.SALT));
    if (s && s.date === iso) return s;
  }catch{}
  return {date: iso, guesses: [], done: false, won: false};
}
function saveState(){
  if (S.practice) return;                       // practice rounds are not saved
  try{ localStorage.setItem(CFG.LS_STATE + "_" + CFG.SALT, JSON.stringify(S)); }catch{}
}
function loadStats(){
  try{
    const s = JSON.parse(localStorage.getItem(CFG.LS_STATS));
    if (s && Array.isArray(s.dist)) return s;
  }catch{}
  return {played: 0, won: 0, streak: 0, maxStreak: 0, lastWin: "", dist: [0,0,0,0,0,0]};
}
function recordResult(won, nGuesses, iso){
  const st = loadStats();
  st.played++;
  if (won){
    st.won++;
    st.dist[nGuesses - 1]++;
    const y = new Date(Date.parse(iso + "T00:00:00Z") - 86400000).toISOString().slice(0,10);
    st.streak = (st.lastWin === y) ? st.streak + 1 : 1;
    st.maxStreak = Math.max(st.maxStreak, st.streak);
    st.lastWin = iso;
  } else {
    st.streak = 0;
  }
  try{ localStorage.setItem(CFG.LS_STATS, JSON.stringify(st)); }catch{}
}

/* ════════════════════════════════════════════════════════════════
   DATA COLLECTION — sends one row per completed game to the
   Oravia Data sheet, same endpoint + sendBeacon pattern as lessons
   ════════════════════════════════════════════════════════════════ */
function sendResult(){
  try{
    navigator.sendBeacon(CFG.LOG_URL, JSON.stringify({
      event_type: "wordle_result",
      timestamp:  new Date().toISOString(),
      learner_id: localStorage.getItem("oravia_user_id") || "anonymous",
      mode:       S.practice ? "practice" : "daily",
      date:       S.practice ? "" : S.date,
      puzzle:     S.practice ? "" : puzzleNumber(S.date),
      word:       ANSWER.w,
      won:        S.won,
      num_guesses: S.guesses.length,
      guesses:    S.guesses.join("|"),
    }));
  }catch{ /* logging must never break the game */ }
}

/* ════════════════════════════════════════════════════════════════
   SCORING — standard two-pass with duplicate handling
   ════════════════════════════════════════════════════════════════ */
function scoreGuess(guess, answer){
  const n = answer.length;
  const res = new Array(n).fill("miss");
  const remaining = {};
  for (let i = 0; i < n; i++){
    if (guess[i] === answer[i]) res[i] = "hit";
    else remaining[answer[i]] = (remaining[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < n; i++){
    if (res[i] === "hit") continue;
    if (remaining[guess[i]] > 0){ res[i] = "near"; remaining[guess[i]]--; }
  }
  return res;
}

/* ════════════════════════════════════════════════════════════════
   RENDER + INTERACTION
   ════════════════════════════════════════════════════════════════ */
let ANSWER = null;   // entry {w, e, ea, bd}
let S = null;        // state {date, guesses, done, won}
let POOL = [];       // playable entries, for practice rounds
let current = "";
const keyEls = new Map();

function buildBoard(len){
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let r = 0; r < CFG.MAX_GUESSES; r++){
    const row = document.createElement("div");
    row.className = "row";
    row.style.gridTemplateColumns = `repeat(${len}, var(--tile))`;
    for (let c = 0; c < len; c++){
      const t = document.createElement("div");
      t.className = "tile";
      row.appendChild(t);
    }
    board.appendChild(row);
  }
}
function buildKeyboard(){
  const rows = [["a","e","i","o","u"],
                ["b","c","d","f","g","h","j","l","m"],
                ["Enter","n","p","r","s","t","v","w","y","Back"]];
  const kb = document.getElementById("kb");
  kb.innerHTML = "";
  rows.forEach((r, ri) => {
    const div = document.createElement("div");
    div.className = "kb-row" + (ri === 0 ? " vowels" : "");
    for (const k of r){
      const b = document.createElement("button");
      b.textContent = k === "Back" ? "⌫" : k;
      b.className = "key" + (k.length > 1 ? " wide" : "");
      b.dataset.k = k;
      b.addEventListener("click", () => press(k));
      div.appendChild(b);
      if (k.length === 1) keyEls.set(k, b);
    }
    kb.appendChild(div);
  });
}
function paintRow(r, guess, marks, animate){
  const row = document.getElementById("board").children[r];
  for (let c = 0; c < guess.length; c++){
    const t = row.children[c];
    t.textContent = guess[c];
    if (animate) setTimeout(() => { t.classList.add(marks[c], "reveal"); }, c * 120);
    else t.classList.add(marks[c]);
  }
  for (let c = 0; c < guess.length; c++){
    const k = keyEls.get(guess[c]);
    if (!k) continue;
    const rank = {miss: 1, near: 2, hit: 3};
    const cur = k.classList.contains("hit") ? 3 : k.classList.contains("near") ? 2 : k.classList.contains("miss") ? 1 : 0;
    if (rank[marks[c]] > cur){
      k.classList.remove("hit","near","miss");
      k.classList.add(marks[c]);
    }
  }
}
function paintCurrent(){
  const row = document.getElementById("board").children[S.guesses.length];
  if (!row) return;
  for (let c = 0; c < ANSWER.w.length; c++){
    const t = row.children[c];
    t.textContent = current[c] || "";
    t.classList.toggle("filled", !!current[c]);
  }
}
function say(text){
  const m = document.getElementById("msg");
  m.textContent = text;
  if (text) setTimeout(() => { if (m.textContent === text) m.textContent = ""; }, 2200);
}
function press(k){
  if (S.done) return;
  if (k === "Enter") return submit();
  if (k === "Back"){ current = current.slice(0, -1); paintCurrent(); return; }
  if (!ALPHABET.includes(k)) return;
  if (current.length >= ANSWER.w.length) return;
  current += k;
  paintCurrent();
}
function submit(){
  if (current.length !== ANSWER.w.length){
    say(`Needs ${ANSWER.w.length} letters`);
    const row = document.getElementById("board").children[S.guesses.length];
    row.classList.add("shake");
    setTimeout(() => row.classList.remove("shake"), 400);
    return;
  }
  const marks = scoreGuess(current, ANSWER.w);
  paintRow(S.guesses.length, current, marks, true);
  S.guesses.push(current);
  const won = current === ANSWER.w;
  current = "";
  if (won || S.guesses.length >= CFG.MAX_GUESSES){
    S.done = true; S.won = won;
    if (!S.practice) recordResult(won, S.guesses.length, S.date);
    sendResult();
    saveState();
    setTimeout(finish, ANSWER.w.length * 120 + 500);
  } else {
    saveState();
  }
}
function finish(){
  say(S.won ? "Solved — bravo!" : "Out of guesses");
  document.getElementById("rv-word").textContent = ANSWER.w;
  document.getElementById("rv-gloss").textContent = ANSWER.ea || ANSWER.e;
  const bdWrap = document.getElementById("rv-bd-wrap");
  const bdEl = document.getElementById("rv-bd");
  bdEl.innerHTML = "";
  if (ANSWER.bd && ANSWER.bd.length){
    ANSWER.bd.forEach(([sound, meaning, kind], i) => {
      if (i > 0){
        const plus = document.createElement("span");
        plus.className = "bb plus"; plus.textContent = "+";
        bdEl.appendChild(plus);
      }
      const chip = document.createElement("span");
      chip.className = "bb";
      chip.innerHTML = `<span class="sound"></span><span class="kind"></span><span class="mean"></span>`;
      chip.querySelector(".sound").textContent = sound;
      chip.querySelector(".kind").textContent = kind || "";
      chip.querySelector(".mean").textContent = meaning || "";
      bdEl.appendChild(chip);
    });
    bdWrap.style.display = "";
  } else {
    bdWrap.style.display = "none";
  }
  document.getElementById("rv-link").href = CFG.DICT_URL(ANSWER.w);
  renderStats();
  document.getElementById("reveal").classList.add("show");
  document.getElementById("stats").classList.toggle("show", !S.practice);
}
function renderStats(){
  const st = loadStats();
  document.getElementById("st-played").textContent = st.played;
  document.getElementById("st-winpct").textContent = st.played ? Math.round(100 * st.won / st.played) : 0;
  document.getElementById("st-streak").textContent = st.streak;
  document.getElementById("st-max").textContent = st.maxStreak;
  const dist = document.getElementById("st-dist");
  dist.innerHTML = "";
  const max = Math.max(1, ...st.dist);
  st.dist.forEach((n, i) => {
    const row = document.createElement("div");
    row.className = "dist-row";
    const bar = document.createElement("span");
    bar.className = "bar";
    bar.style.width = Math.round(8 + 90 * n / max) + "%";
    bar.textContent = n;
    row.append(Object.assign(document.createElement("span"), {textContent: i + 1}), bar);
    dist.appendChild(row);
  });
}

function setClue(){
  document.getElementById("clue-gloss").textContent = "“" + ANSWER.e + "”";
  document.getElementById("clue-len").textContent = ` · ${ANSWER.w.length} letters`;
  const [tipSound, tipMean] = ANSWER.bd[0];
  document.getElementById("tip-sound").textContent = tipSound;
  document.getElementById("tip-mean").textContent = tipMean;
}
function startPractice(){
  let next = POOL[Math.floor(Math.random() * POOL.length)];
  if (POOL.length > 1) while (next.w === ANSWER.w)
    next = POOL[Math.floor(Math.random() * POOL.length)];
  ANSWER = next;
  S = {practice: true, guesses: [], done: false, won: false};
  current = "";
  document.getElementById("reveal").classList.remove("show");
  document.getElementById("msg").textContent = "";
  setClue();
  buildBoard(ANSWER.w.length);
  buildKeyboard();               // rebuilt to clear key colors
}

/* ════════════════════════════════════════════════════════════════
   BOOT
   ════════════════════════════════════════════════════════════════ */
(async function init(){
  const iso = params.get("date") || todayISO();   // ?date=YYYY-MM-DD for testing
  document.getElementById("meta-date").textContent =
    new Date(iso + "T12:00:00Z").toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric", timeZone:"UTC"});
  document.getElementById("meta-num").textContent = puzzleNumber(iso);

  const {list, embedded} = await loadWords();
  document.getElementById("vocab-badge").hidden = !embedded;

  ANSWER = pickDaily(list, iso);
  S = loadState(iso);
  POOL = list.filter(x => /^[a-z]+$/.test(x.w) && x.bd && x.bd.length &&
                          x.w.length >= Math.min(...CFG.LENGTHS) &&
                          x.w.length <= Math.max(...CFG.LENGTHS));

  setClue();
  document.getElementById("btn-again").addEventListener("click", startPractice);

  buildBoard(ANSWER.w.length);
  buildKeyboard();

  // restore saved guesses (no animation)
  S.guesses.forEach((g, r) => paintRow(r, g, scoreGuess(g, ANSWER.w), false));
  if (S.done) finish();

  document.addEventListener("keydown", ev => {
    if (ev.key === "Enter") press("Enter");
    else if (ev.key === "Backspace") press("Back");
    else if (/^[a-z]$/i.test(ev.key)) press(ev.key.toLowerCase());
  });
})();

</script>
